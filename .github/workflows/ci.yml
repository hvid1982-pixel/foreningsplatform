name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foreningsplatform
          POSTGRES_PASSWORD: foreningsplatform
          POSTGRES_DB: foreningsplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foreningsplatform"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      APP_ENV: test
      CI: "true"
      DATABASE_URL: postgres://foreningsplatform:foreningsplatform@localhost:5432/foreningsplatform
      TEST_DATABASE_URL: postgres://foreningsplatform:foreningsplatform@localhost:5432/foreningsplatform_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-01
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_TRANSPORT: log
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create test database
        run: PGPASSWORD=foreningsplatform psql -h localhost -U foreningsplatform -c "CREATE DATABASE foreningsplatform_test"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Check that migrations match the schema
        run: |
          pnpm db:generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Migrate and seed E2E database
        run: pnpm db:migrate && pnpm db:seed

      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
